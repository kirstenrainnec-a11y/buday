<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🤍</title>
  <style>
    :root {
      --bg: #f4f7f4;
      --card: #ffffff;
      --accent: #768a76;
      --accent-soft: #e2ebe2;
      --text: #384238;
      --text-muted: #6b786b;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px 16px;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.04);
      text-align: center;
      border: 1px solid #e0e8e0;
    }

    .photo-container {
      width: 100%;
      height: 230px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      background-color: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 1.5rem;
      color: var(--accent);
      margin: 0 0 4px 0;
    }

    .date {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .letter-box {
      background: var(--bg);
      padding: 18px;
      border-radius: 12px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 20px;
      border-left: 3px solid var(--accent);
    }

    .wish-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .wish-btn:active {
      background: #5d705d;
    }

    .wish-display {
      margin-top: 15px;
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 500;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="photo-container">
      <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600&auto=format&fit=crop" alt="Birthday Photo">
    </div>

    <h1>Happy Birthday! 🎉</h1>
    <div class="date">September 30</div>

    <div class="letter-box">
      Happy Birthday! 🤍<br><br>
      Just wanted to make sure you start today knowing how much you are appreciated. I hope today brings you peace, good food, and a well-deserved breather.<br><br>
      Enjoy your special day!
    </div>

    <button class="wish-btn" onclick="showSurprise()">Tap for a Birthday Wish ✨</button>
    <div id="wish" class="wish-display"></div>
  </div>

  <script>
    const wishes = [
      "May this year bring you quiet moments and true peace. 🌿",
      "Hope you get your favorite cake and food today! 🎂",
      "Wishing you a year full of comfort, happiness, and light. ✨",
      "Take today one peaceful moment at a time. Enjoy your day! 🤍"
    ];

    function showSurprise() {
      const randomWish = wishes[Math.floor(Math.random() * wishes.length)];
      document.getElementById('wish').innerText = randomWish;
    }
  </script>

</body>
</html>
